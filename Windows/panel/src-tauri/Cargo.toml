[package]
name = "utochpad-settings"
version = "1.0.0"
description = "Utochpad settings panel"
authors = ["liuxi"]
edition = "2024"

[lib]
name = "utochpad_settings_lib"
crate-type = ["rlib"]

[[bin]]
name = "Utochpad"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
